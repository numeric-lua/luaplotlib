---
name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: LuaJIT tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes luajit

      - name: Run tests
        run: ./scripts/test.sh
